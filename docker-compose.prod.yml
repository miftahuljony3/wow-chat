version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wowchat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No public port — internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: wowchat_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wowchat_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wowchat-backend:latest
    container_name: wowchat_backend
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    env_file: ./backend/.env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    image: wowchat-backend:latest
    container_name: wowchat_celery
    restart: unless-stopped
    command: celery -A core worker -l info -c 4 -Q default,webhooks,ai_responses
    env_file: ./backend/.env
    volumes:
      - media_data:/app/media
    depends_on:
      - backend

  celery_beat:
    image: wowchat-backend:latest
    container_name: wowchat_beat
    restart: unless-stopped
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ./backend/.env
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: wowchat-frontend:latest
    container_name: wowchat_frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: wowchat_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:80"   # Host-nginx proxies wow.gpayauto.org → here
    volumes:
      - ./nginx/wow-chat.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  media_data:
  static_data:
