server {
    listen 80;
    server_name wow.gpayauto.org;

    client_max_body_size 20M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # Use Docker's internal DNS resolver so service names are re-resolved
    # on every request — prevents stale IPs after container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket connections (Django Channels)
    location /ws/ {
        set $ws_backend http://backend:8000;
        proxy_pass $ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # User-uploaded media — served directly by nginx from the mounted volume.
    # Django does NOT serve /media/ in production (DEBUG=False), and Facebook's
    # servers must be able to fetch auto-post images from this public URL.
    # ^~ ensures this prefix wins over the regex location below.
    location ^~ /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django: API, webhooks, admin, static assets
    location ~ ^/(api|webhooks|admin|static)/ {
        set $django_backend http://backend:8000;
        proxy_pass $django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Next.js frontend — everything else
    location / {
        set $next_frontend http://frontend:3000;
        proxy_pass $next_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
