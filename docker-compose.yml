version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wowchat_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wowchat}
      POSTGRES_USER: ${POSTGRES_USER:-wowchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wowchat_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wowchat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: wowchat_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-wowchat}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-wowchat_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-wowchat_messages}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wowchat_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-wowchat_redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-wowchat_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wowchat_backend
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wowchat_celery
    command: celery -A core worker -l info -c 4 -Q default,webhooks,ai_responses
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wowchat_beat
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wowchat_frontend
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  media_data:
