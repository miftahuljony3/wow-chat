upstream wowchat_backend {
    server backend:8000;
    keepalive 32;
}

upstream wowchat_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name wow.gpayauto.org;

    client_max_body_size 20M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # WebSocket connections (Django Channels)
    location /ws/ {
        proxy_pass http://wowchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Django: API, webhooks, admin, static assets, media
    location ~ ^/(api|webhooks|admin|static|media)/ {
        proxy_pass http://wowchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Next.js frontend — everything else
    location / {
        proxy_pass http://wowchat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Next.js HMR websocket in dev — harmless in prod
        proxy_set_header Upgrade $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
